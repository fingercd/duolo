[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "duolo"
version = "0.4.0"
description = "Duolo: guarded synchronization for paired Git worktrees"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}

[project.scripts]
duo = "duolo.__main__:main"
worktree-bridge = "duolo.__main__:main"
wtb = "duolo.__main__:main"

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]

[tool.setuptools.packages.find]
where = ["src"]
